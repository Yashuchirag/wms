[project]
name = "wms-forecasting"
version = "0.1.0"
description = "SKU-level demand forecasting pipeline for the WMS"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "xgboost",
    "mlflow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
notebooks = [
    "jupyter",
    "matplotlib",
    "seaborn",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forecasting*"]
