spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wms
    username: postgres
    password: 274136
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  # Flyway configuration for dev
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    clean-disabled: false  # Allow clean in dev
    url: jdbc:postgresql://localhost:5432/wms
    user: postgres
    password: 274136

logging:
  level:
    com.warehouse.wms: DEBUG
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG