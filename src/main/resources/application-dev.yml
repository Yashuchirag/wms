spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wms_dev
    username: wms_user
    password: wms_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.warehouse.wms: DEBUG